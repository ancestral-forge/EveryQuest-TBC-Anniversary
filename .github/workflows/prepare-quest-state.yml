name: Prepare issue 48
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ancestral-forge/EveryQuest-TBC-Anniversary' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'expose-structured-quest-state'
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: expose-structured-quest-state
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 lua-check libxml2-utils
      - name: Inspect clean state and validate unchanged main baseline
        run: |
          set -euo pipefail
          git worktree list
          git status --short --branch
          git log -1 --oneline
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 7be2c1c5bef9796c5c5ff62a6f76b7e7f0154141 HEAD
          git worktree add --detach "$RUNNER_TEMP/eq-baseline" 7be2c1c5bef9796c5c5ff62a6f76b7e7f0154141
          cd "$RUNNER_TEMP/eq-baseline"
          tools/verify-addon.sh
      - name: Implement and validate in a separate task worktree
        run: |
          set -euo pipefail
          git worktree add -b issue-48-validation "$RUNNER_TEMP/eq-implementation" HEAD
          cd "$RUNNER_TEMP/eq-implementation"
          git worktree list
          git status --short --branch
          git log -1 --oneline
          test -z "$(git status --porcelain)"
          python3 .github/prepare-quest-state.py
          git add -A
          tools/verify-addon.sh
          npx --yes @fission-ai/openspec@1.10.0 validate --all
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- EveryQuest/Everyquest.lua EveryQuest/QuestStore.lua EveryQuest/EveryQuest.toc tools/test-quest-status-model.lua tools/test-quest-data-preparation.lua
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openspec/changes/expose-structured-quest-state/tasks.md')
          s = p.read_text()
          for task in ['1.3', '2.1', '2.2', '2.3', '3.1', '3.2']:
              s = s.replace(f'- [ ] {task} ', f'- [x] {task} ')
          p.write_text(s)
          PY
          npx --yes @fission-ai/openspec@1.10.0 validate --all
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: integrate structured quest state and verify issue 48'
          git push origin HEAD:refs/heads/expose-structured-quest-state
